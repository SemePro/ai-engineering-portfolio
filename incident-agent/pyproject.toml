[project]
name = "incident-agent"
version = "1.0.0"
description = "Agentic incident response engine with a synthetic incident lab and evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.9,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
incident-eval = "incident_agent.evals.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_agent = ["lab/scenarios/*.json", "evals/thresholds.json"]
