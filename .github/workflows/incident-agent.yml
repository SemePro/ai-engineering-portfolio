name: Incident agent

# PRs: keyless checks only (unit/integration tests + deterministic smoke eval) - no model spend.
# Manual / weekly: full Claude evaluation against regression thresholds (~33 investigations).

on:
  pull_request:
    paths:
      - "incident-agent/**"
      - "secure-ai-gateway/**"
      - "ai-portfolio-web/**"
      - ".github/workflows/incident-agent.yml"
  push:
    branches: [main]
    paths:
      - "incident-agent/**"
      - "secure-ai-gateway/**"
      - "ai-portfolio-web/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Claude eval suite"
        type: choice
        options: [full, core, abstain, faults, caching]
        default: full
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  agent:
    name: Agent tests + smoke eval
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: incident-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - name: Smoke eval (scripted baseline, golden thresholds)
        run: python -m incident_agent.evals.run --suite smoke --check-thresholds --out /tmp/eval-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval
          path: /tmp/eval-results
          retention-days: 14

  gateway:
    name: Gateway tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: secure-ai-gateway/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check src tests
      - run: pytest -q

  web:
    name: Web lint + build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-portfolio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-portfolio-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  claude-eval:
    name: Claude evaluation
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: incident-agent
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run suite
        run: |
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          if [ "$SUITE" = "caching" ]; then
            python -m incident_agent.evals.run --suite caching --out eval-results
          else
            python -m incident_agent.evals.run --suite "$SUITE" --check-thresholds --out eval-results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-eval-${{ github.run_id }}
          path: incident-agent/eval-results
          retention-days: 90
