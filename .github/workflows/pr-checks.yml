name: PR checks

# Every PR: tests, lint, typecheck, build, deterministic (no-LLM) agent evaluation.
# No job here calls a paid model API. The Claude evaluation lives in agent-eval.yml (manual only).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Incident agent - tests + smoke eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: incident-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: incident-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Unit, integration, authorization, budget and tool-contract tests
        run: pytest
      - name: Smoke eval (scripted baseline, no LLM, golden thresholds)
        run: python -m incident_agent.evals.run --suite smoke --check-thresholds --out /tmp/eval-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval
          path: /tmp/eval-results
          retention-days: 14

  gateway:
    name: Secure AI Gateway - tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: secure-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: secure-ai-gateway/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check src tests
      - run: pytest -q

  legacy-services:
    name: ${{ matrix.service }} - tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [rag-knowledge-assistant, llm-eval-harness]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check src tests
      - run: pytest -q

  web:
    name: Web - lint, typecheck, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-portfolio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-portfolio-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright (desktop + mobile; backend calls are mocked)
        run: npx playwright test
        env:
          CI: "true"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [agent, gateway]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./secure-ai-gateway
          push: false
      - uses: docker/build-push-action@v5
        with:
          context: ./incident-agent
          push: false
